      required: true
      example: '["4567"]'
      selector:
        text:
          multiple: true
    title:
      required: true
      example: "Absence"
      selector:
        text:
    text:
      required: true
      example: "Camille est malade aujourd'hui."
      selector:
        text:
          multiline: true

