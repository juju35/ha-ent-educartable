mark_read:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: educartable
    message_id:
      required: true
      example: "12345"
      selector:
        text:

reply:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: educartable
    message_id:
      required: true
      example: "12345"
      selector:
        text:
    text:
      required: true
      example: "Bonjour, c'est noté, merci."
      selector:
        text:
          multiline: true

write_message:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: educartable
